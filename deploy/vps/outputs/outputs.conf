# VPS platform destinations - SAMPLE (tracked, no secrets).
# Real live keys go in outputs.local.conf (gitignored) in THIS same folder.
# The supervisor's control server writes outputs.local.conf when you edit keys in
# the cockpit's "Площадки" section; the relayer hot-reloads it every 3s.
#
# Format: <tatami letter> <full rtmp url with key>. A leading '#' = disabled.
#
# VK Video ingest (stream_key from video.createBroadcast):
# a rtmp://ovsu.okcdn.ru/input/<stream_key>
# YouTube live:
# b rtmp://a.rtmp.youtube.com/live2/<stream_key>
