# TournamentLive local streaming infrastructure — MVP
# Layer 1: MediaMTX (RTMP ingest + HLS/WebRTC preview + API + recording)
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f mediamtx

name: tournamentlive-infra

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: tl-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935/tcp"     # RTMP ingest (phones push here)
      - "8888:8888/tcp"     # HLS + WebRTC playback + API-facing player page
      - "8889:8889/tcp"     # WebRTC (WHEP/WHIP)
      - "8889:8889/udp"     # WebRTC ICE
      - "9997:9997/tcp"     # HTTP Control API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/recordings:/var/recordings

  # Layer 3: web cockpit. Serves panel/index.html and reverse-proxies the
  # MediaMTX API (/v3) and player so the browser sees a single origin (no CORS).
  panel:
    image: nginx:alpine
    container_name: tl-panel
    restart: unless-stopped
    depends_on:
      - mediamtx
    ports:
      - "8000:80/tcp"       # open http://localhost:8000
    volumes:
      - ./panel/index.html:/usr/share/nginx/html/index.html:ro
      - ./panel/config.js:/usr/share/nginx/html/config.js:ro
      - ./panel/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Layer 2: continuity supervisor (in a container - no host PowerShell).
  # Feeds each broadcast/<x> from the live tatami input or the fallback loop,
  # so outputs never drop. Uses the MediaMTX API anonymously (local grants 'any').
  supervisor:
    build: ./deploy/vps/supervisor
    image: tl-supervisor:local
    container_name: tl-supervisor
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      MEDIAMTX_HOST: mediamtx
      TATAMIS: a b c d e f g h
      FALLBACK_DIR: /fallback
      INTERVAL_SEC: "2"
      OUTPUTS_PATH: /outputs/outputs.local.conf
      # Operator captions ("татами/турнир") persist next to the outputs files.
      LABELS_FILE: /outputs/labels.json
    volumes:
      - ./fallback:/fallback:ro
      # The panel edits platform keys here (writes outputs.local.conf); the
      # supervisor's control server needs read-write access to this dir.
      - ./outputs:/outputs:rw

  # Layer 2.5: relay - pushes each broadcast/<x> OUT to VK/YouTube per outputs.conf.
  # Platform URLs/keys live in ./outputs/outputs.conf, NOT in the QR.
  relayer:
    build: ./relay
    image: tl-relayer:local
    container_name: tl-relayer
    restart: unless-stopped
    depends_on:
      - mediamtx
      - supervisor
    environment:
      MEDIAMTX_HOST: mediamtx
    volumes:
      - ./outputs:/outputs:ro
