server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the MediaMTX control API under the same origin so the panel can
    # fetch /v3/paths/list without CORS. 'mediamtx' is the compose service name.
    location /v3/ {
        proxy_pass http://mediamtx:9997;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Proxy MediaMTX built-in HLS player pages (preview iframes) too.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Operator control (panel END/RESUME buttons) -> supervisor control server.
    # /ctl/end/a  ->  http://supervisor:8090/end/a
    location /ctl/ {
        proxy_pass http://supervisor:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
