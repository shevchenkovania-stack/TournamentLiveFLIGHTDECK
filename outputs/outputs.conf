# Куда ретранслировать потоки (адреса площадок живут ЗДЕСЬ, а не в QR).
#
# Формат строки:   <буква татами> <пробел> <полный RTMP-адрес площадки с ключом>
#   - буква = a..h (зарезервировано 8 татами; тот же вход, что в QR: tatami/<буква> -> broadcast/<буква> -> площадка)
#   - строки с # и пустые игнорируются
#   - один и тот же broadcast можно лить на несколько площадок - просто несколько строк с одной буквой
#   - ВНИМАНИЕ: в поле ключа только stream key БЕЗ rtmp://. Панель и ctl.py
#     отклоняют «склеенный» двойной URL (rtmp://…/rtmp://…) и заглушки.
#
# Пустой файл = ретрансляции нет (безопасно, ничего не ломается).
# ВНИМАНИЕ: сюда вставляются ЛИЧНЫЕ ключи площадок - НЕ коммити этот файл в git
# (см. .gitignore: outputs/outputs.local.conf). Удобно держать боевые ключи в
# outputs/outputs.local.conf, а этот файл оставить как образец.
#
# Примеры (раскомментируй и подставь реальные ключи):
# a rtmp://a.rtmp.youtube.com/live2/abcd-1234-efgh-5678-ijkl
# a rtmp://push.vk.com/live/VK-BROADCAST-KEY
# b rtmp://a.rtmp.youtube.com/live2/another-key-xxxx
