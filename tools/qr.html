<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TournamentLive — QR для локального сервера</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; background:#0f1115; color:#e6e9ef; margin:0; padding:24px; }
    h1 { font-size:18px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    label { display:block; font-size:12px; color:#8b94a7; margin-bottom:4px; }
    input, select { background:#171a21; color:#e6e9ef; border:1px solid #262b36; border-radius:8px; padding:8px 10px; font-size:14px; }
    #qr { background:#fff; padding:12px; border-radius:12px; display:inline-block; }
    textarea { width:100%; max-width:640px; height:150px; background:#171a21; color:#cfe3ff; border:1px solid #262b36; border-radius:8px; padding:10px; font-family:monospace; font-size:12px; }
    .hint { color:#8b94a7; font-size:13px; }
  </style>
</head>
<body>
  <h1>QR-конфиг → локальный MediaMTX</h1>
  <p class="hint">Впиши IP этого ПК (той же сети, что и телефон) и номер экрана (ключ 1..8). Отсканируй QR экраном сканера в приложении TournamentLive. Ключ N = Экран N в рестримере.</p>

  <div class="row">
    <div>
      <label>IP этого ПК (LAN)</label>
      <input id="ip" size="18" value="192.168.50.164" />
    </div>
    <div>
      <label>Ключ (номер экрана)</label>
      <select id="key">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <div>
      <label>Разрешение</label>
      <select id="res">
        <option value="720">720p</option>
        <option value="1080">1080p</option>
        <option value="480">480p</option>
      </select>
    </div>
  </div>

  <div id="qr"></div>

  <h1 style="font-size:14px;margin-top:24px">JSON в QR (для проверки)</h1>
  <textarea id="json" readonly></textarea>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    function buildConfig() {
      const ip = $('ip').value.trim();
      const k  = $('key').value;
      const res = $('res').value;
      return {
        tatami_name: 'SCREEN ' + k,
        hosting_provider: 'local',
        stream_key: k,
        // getFullStreamUrl = stream_url + stream_key  =>  rtmp://ip:1935/tatami/<N>
        stream_url: `rtmp://${ip}:1935/tatami/`,
        overlay_url: '',
        overlay_position: '',
        overlay_refresh_sec: 10000,
        advertisement_pictures: '',
        stream_resolution: res,
        stream_fps: 30,
        stream_bitrate: res === '1080' ? 4000000 : (res === '720' ? 2500000 : 1200000),
        is_mic_on: true,
        is_overlay_visible: false
      };
    }
    function render() {
      const cfg = buildConfig();
      const txt = JSON.stringify(cfg);
      $('json').value = JSON.stringify(cfg, null, 2);
      $('qr').innerHTML = '';
      const canvas = document.createElement('canvas');
      $('qr').appendChild(canvas);
      QRCode.toCanvas(canvas, txt, { width: 260, margin: 1 }, (err) => {
        if (err) $('qr').textContent = 'QR lib не загрузилась (нужен интернет на ПК): ' + err;
      });
    }
    ['ip','key','res'].forEach(id => $(id).addEventListener('input', render));
    render();
  </script>
</body>
</html>
